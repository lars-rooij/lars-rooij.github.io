<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEdeRooij</title>
    <link rel="icon" type="image/x-icon" href="/imgs/icon2.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="layout-wrapper">
        <div class="layout">
            <header class="header">
                <button class="header-button header-button-left" type="button" onclick="goToRandomAssignment()">
                    <span class="header-button-arrow">??</span>
                    <span class="header-button-title">Random</span>
                </button>

                <div class="header-center">
                    <h1>Search</h1>
                </div>

                <button class="header-button header-button-right" type="button" onclick="location.href='index.html'">
                    <span class="header-button-arrow">&gt;&gt;</span>
                    <span class="header-button-title">Home</span>
                </button>
            </header>

            <section class="column">
                <h2>Find a Page</h2>

                <div class="search-box">
                    <form id="search-form">
                        <input
                            id="search-input"
                            type="search"
                            name="q"
                            placeholder="Search by title, skill or tag..."
                            aria-label="Search portfolio"
                        >
                        <button type="submit">Search</button>
                    </form>
                </div>
            </section>

            <br>

            <section id="search-results" class="search-results"></section>
        </div>

        <aside class="floating-panel">
            <div class="search-box">
                <form action="search.html" method="get">
                    <input type="search" name="q" placeholder="Search..." aria-label="Search">
                    <button type="submit">Search</button>
                </form>
            </div>

            <div class="dropdown">
                <button class="dropdown-toggle" type="button" aria-expanded="false">
                    <span>Quick Links</span>
                    <span class="dropdown-arrow">▼</span>
                </button>

                <div class="dropdown-content" id="quick-links"></div>
            </div>
        </aside>
    </main>

    <script src="search.js"></script>
    <script src="main.js"></script>

</body>
</html>
